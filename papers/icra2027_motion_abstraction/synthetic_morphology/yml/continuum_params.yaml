# Oddkin continuum — complex synthetic morphologies (RoboGrammar-inspired).
family: oddkin
description: >
  Continuous communicative morphology family with unusual multi-link bodies.
  alpha=0 radial arthropod; alpha=0.5 canted asymmetric crab-spine;
  alpha=1.0 Y-branching gesture tree. Not a Roomba disk + primitives.

samples:
  gcr_alpha0:
    alpha: 0.0
    name: Trileg Crown
    xml: ../xml/gcr_alpha0.xml
    style: radial_arthropod
    actuated_joints: [hip0, knee0, hip1, knee1, hip2, knee2, crown_spin]
    channels: [base_xy, base_yaw, radial_legs, crown]

  gcr_alpha05:
    alpha: 0.5
    name: Canted Spine Crab
    xml: ../xml/gcr_alpha05.xml
    style: asymmetric_branched
    actuated_joints: [flap_l, flap_r, v1_pitch, v1_yaw, v2_pitch, v2_twist, collar_spin, v3_pitch, pin_r0, pin_r1, pin_r2, pin_l0, pin_l1, antenna]
    channels: [base_xy, base_yaw, canted_spine, collar, long_pincer, short_pincer, antenna]

  gcr_alpha1:
    alpha: 1.0
    name: Branching Gesture Tree
    xml: ../xml/gcr_alpha1.xml
    style: y_branch_tree
    actuated_joints: [trunk1_yaw, trunk1_pitch, trunk2_yaw, trunk2_pitch, sat_spin, trunk3_pitch, trunk3_roll, bl0, bl1, bl2, br0, br1, br2, br3, claw0, claw1, claw2, neck_yaw, neck_pitch, head_roll]
    channels: [base_xy, base_yaw, trunk, sat_ring, left_paddle_arm, right_claw_arm, neck_head]
