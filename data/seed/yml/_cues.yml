  small_rhythmic_bounce: heel bounce, shoulder bounce
  micro_attention_pulse: tiny hand flick, micro nod
  laughter_substitute: shoulder bounce, open-mouth smile
  shame_shy_substitute: head down turn, face cover glance
  listening_lean_substitute: ear lean, hand-to-ear cue