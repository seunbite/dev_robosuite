  request_turn: slight hand raise, open palm ask
  yield_turn: open palm offer, backward hand sweep
  guiding_arm: open arm guide, light directional sweep
  gentle_retreat_motion: backward palm press, step-back cue
  inviting_to_sit: downward open palm, chair-indicating sweep
  protective_arm_out: side arm shield, forward block hold
  escorting_gesture: arm-leading guide, body-turn invitation
  turn_yield_lower_hand: hand lower release, open palm give-way
  clarification_request_palm_tilt: palm tilt ask, finger-question curl
  slow_down_request_palm_down: slow downward press, repeated soft push
  speed_up_circular_cue: circular wrist roll, forward flick
  resume_speaking_pull: hand pull-in cue, nod-plus-pull
  emphasize_point_downbeat: downward chop, fist beat accent
  wait_for_me_backward_palm: backward palm wave, over-shoulder stop
