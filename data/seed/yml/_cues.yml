iconic:
  wave_hi: Wave one hand side to side (Hello / Hi)
  raising_hand_greeting: Raise one hand briefly (Greeting / Acknowledgement)
  bow_greeting: Bow slightly from the waist (Respect / Greeting)
  handshake_offer: Extend one hand vertically forward as if offering a handshake (Asking for handshake)
  handshake_imitation: Move one hand up and down vertically as if shaking someone’s hand (Imitating handshake)
  self_hug: Wrap both arms around yourself (Hug / Comfort)
  blow_kiss: Bring fingertips to lips and blow outward (Blow a kiss)
  big_heart_above_head: Form a big heart shape above head (Love)
  hand_over_heart: Place one hand over chest (Sincerity / Gratitude)
  raise_fists_victory: Raise both fists upward (Victory / Excitement)
  fist_pump: Pump one fist downward (Success / Yes!)
  flex_bicep: Flex one arm to show bicep (Strength)
  nod_yes: Nod head up and down (Yes)
  shake_head_no: Shake head side to side (No)
  shrug_idk: Shrug shoulders with palms up (I don’t know)
  scratch_head_confused: Scratch head lightly (Confusion)
  tilt_head_curious: Tilt head slightly (Curiosity)
  facepalm: Place palm over face (Facepalm / Frustration)
  point_self: Point to chest with index finger (Me)
  point_you: Point forward with index finger (You)
  beckon_come_here: Turn palm downward and curl fingers inward repeatedly (Come here / Beckon)
  stop_palm_out: Extend palm forward flat (Stop)
  raise_index_one_moment: Raise index finger upright (One moment / Important point)
  shh_gesture: Place index finger on lips (Shh / Be quiet)
  pat_stomach: Pat stomach lightly (Hungry / Full)
  rub_arms_cold: Rub both upper arms (Cold)
  fan_face_hot: Fan face with one hand (Hot)
  cover_yawn_sleepy: Open mouth wide and cover it (Sleepy / Yawn)
  rub_eye_tired: Rub one eye (Tired)
  deep_bow_apology: Bow deeply while hands at sides (Apology)
  air_quotes: Raise both hands and flex index and middle fingers twice (Air quotes)
  tap_temple_think: Tap temple with index finger (Think / Smart)
  circle_temple_crazy: Rotate index finger near temple (Crazy)
  zip_lips_secret: Slide index finger across lips like zipping (Secret / Won’t tell)
  cross_arms_defensive: Cross arms over chest (Defensive)
  hands_on_hips: Place both hands on hips (Confidence / Annoyed)
  lean_forward_interest: Lean forward slightly with palms open (Interest)
  step_back_surprised: Step back slightly with both palms raised outward (Shock / Surprise)
  cover_mouth_gasp: Cover mouth with palm (Gasp / Oops)
  palms_together_thank_you: Press palms together and bow slightly (Thank you / Respect)
  cheers_toast: Raise one hand as if holding an invisible glass (Cheers)
  highfive_invite: Raise one palm upward as if inviting a high five (Asking for high five)
  highfive_imitation: Swing one raised palm downward as if high-fiving air (Imitating high five)
  fistbump_invite: Extend one fist forward (Asking for fist bump)
  fistbump_imitation: Tap one fist lightly against your other palm (Imitating fist bump)
  pat_self_back: Pat your own back (Encouragement)
  draw_circle_repeat: Draw a circle in the air with index finger (Repeat / Around)
  throat_cut_stop: Slice flat hand horizontally across throat (Cut / Stop it)
  chin_flick_dismiss: Swipe back of fingers outward from under chin (Dismissive / Whatever)
  drum_fingers_waiting: Drum fingers on table or in air (Waiting / Bored)
  curl_fingers_give_me: Turn palm upward and curl fingers inward (Give me)
  open_palm_offering: Extend open palm upward steadily (Offering)
  hands_up_surrender: Raise both hands beside head (I give up / Surrender)
  cover_ears_too_loud: Cover both ears (Too loud / Don’t want to hear)
  arms_open_welcome: Open both arms wide outward (Welcome)
  stretch_arms_up: Stretch both arms upward (Relief / Stretch)
  salute: Bring one hand to forehead in salute position (Salute)
  visor_search: Place one hand above eyebrows as visor and look far (Searching distance)
  
