  agreement_confirm_double_nod_arm: nod with fist lift, nod with open palm
  disagreement_cross_then_release: brief arm cross, head shake release
  reduce_distance_invite_pull: pull-in gesture, open-arm invite
  redirect_path_sweep: side sweep redirect, forward angle guide
  stop_entry_cross_block: arm cross block, step-in block
  allow_entry_open_side: open side step, arm-open allow
  guide_to_position_down_mark: downward point mark, palm-down place
  prevent_fall_support_reach: fast reach grab, body-lunge support
  relief_release_drop: shoulder drop, hand release sigh
  frustration_down_throw: downward fling, sharp drop throw
  disbelief_hold_then_drop: freeze hold then drop, head-back drop
  submission_lowered_open_palm: lowered palms show, slight bow palms
