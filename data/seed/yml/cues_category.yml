categories:
  pose_direction:
    n: 23
    definition: >
      Orientation matters: posture or aim toward space, an addressee, or gaze.
      Recognition depends mainly on dir / gripper_orientation and body aim,
      not on path shape or tempo.
    cues:
      - stop_palm_out
      - tilt_head_curious
      - hands_up_surrender
      - dominance_high_open_hold
      - arms_open_welcome
      - cross_arms_defensive
      - submission_lowered_open_palm
      - point_you
      - raise_fists_victory
      - fist_pump
      - cheers_toast
      - highfive_invite
      - highfive_imitation
      - fistbump_invite
      - request_turn
      - lean_forward_interest
      - lean_side_doubt
      - weight_shift_forward
      - weight_shift_backward
      - torso_rotate_away
      - torso_rotate_toward
      - eye_widen_surprise
      - gaze_shift_avoid

  pose_location:
    n: 22
    definition: >
      Body location matters: pointing to, touching, or holding a specific part
      of one's own body. Spatial target on the body is the primary signal.
    cues:
      - salute
      - self_hug
      - palms_together_thank_you
      - expand_chest
      - point_self
      - pat_stomach
      - pat_self_back
      - facepalm
      - self_scratch_head_confused
      - tap_temple_think
      - circle_temple_crazy
      - rub_eye_tired
      - cover_yawn_sleepy
      - cover_mouth_gasp
      - fan_face_hot
      - shh_gesture
      - throat_cut_stop
      - cover_ears_too_loud
      - chin_flick_dismiss
      - flex_bicep
      - rub_arms_cold
      - disagreement_cross_then_release

  dynamic_direction:
    n: 24
    definition: >
      Movement path or direction matters (forward/back, lateral, up/down,
      pull/push, etc.). Trajectory axis and endpoint dominate; tempo is
      secondary unless tagged separately.
    cues:
      - yield_turn
      - nod_yes
      - shake_head_no
      - cancel_previous_offer_retract
      - resume_speaking_pull
      - uncertainty_wave
      - continue_on_forward_roll
      - abandon_action_drop_turn
      - beckon_come_here
      - guiding_arm
      - protective_arm_out
      - firm_accept_forward_reach
      - emphasize_point_downbeat
      - start_action_forward_snap
      - wait_for_me_backward_palm
      - frustration_down_throw
      - push_pull_dual
      - escorting_gesture
      - prevent_fall_support_reach
      - hesitant_accept_half_reach
      - scale_expand
      - exploration_reach
      - visor_search
      - shrug_idk

  dynamic_temporal:
    n: 21
    definition: >
      Timing or tempo matters: waits, speed, rhythm, pauses. Wrong speed or
      missing hold/pause breaks recognition even if pose and path are correct.
    cues:
      - draw_circle_repeat
      - speed_up_circular_cue
      - retry_action_reset_circle
      - hesitation_pause_hold
      - interrupt_hard
      - interrupt_soft
      - air_quotes
      - slow_down_request_palm_down
      - conditional_accept_pause_then_reach
      - prepare_action_raise_hold
      - final_decision_down_press
      - raise_index_one_moment
      - unsure_response_hand_hover_stop
      - clarification_request_palm_tilt
      - polite_decline_small_push
      - contain_space
      - expand_space
      - compress_space
      - balance_scale
      - stretch_arms_up
      - apology_forward_lowered_hold

  abstract:
    n: 10
    definition: >
      Not easily decomposed into pose/movement; conveys qualitative state or
      intent. Annotate with timing_role and qualitative tags rather than joint axes.
    cues:
      - tempo_cue
      - thinking
      - skepticism
      - agreement
      - shame
      - confusion
      - curiosity
      - anticipation
      - hesitation
      - urgency
