  - {idx: 33, cue: chin_flick_dismiss, recipe: fingers flick from chin}
  - {idx: 34, cue: cover_ears_too_loud, recipe: both hands cover ears}
  - {idx: 35, cue: salute, recipe: hand to forehead}
  - {idx: 36, cue: visor_search, recipe: hand above brow + look}
  - {idx: 59, cue: nod_yes, recipe: head nod oscillation}
  - {idx: 60, cue: shake_head_no, recipe: head side-to-side shake}
  - {idx: 61, cue: air_quotes, recipe: index/middle flex quote gesture}
  - {idx: 62, cue: self_hug, recipe: arms wrap torso}
  - {idx: 64, cue: tilt_head_curious, recipe: head tilt hold}
  - {idx: 65, cue: raise_index_one_moment, recipe: index finger up hold}
  - {idx: 66, cue: shh_gesture, recipe: finger at lips}
  - {idx: 67, cue: rub_arms_cold, recipe: arms crossed, rub repeat}
  - {idx: 69, cue: cross_arms_defensive, recipe: arms folded over chest}
