# emblem_cues_exp1.yml
#
# Reference path: data/seed/yml/emblem_cues_exp1.yml
# Manifest key: emblem_cues_exp1
#
# 43 emblem gestures from exp1 tiago (pilot90 subset).
# An emblem cue is one where a fixed pose (+ optional simple movement)
# is necessary and sufficient for recognition (wave_hi-style), as opposed
# to contextual / procedural / spatial cues (e.g. escorting_gesture).

version: 1
name: emblem_cues_exp1
domain: tiago
exp: "1"
n: 43

definition: >
  Gestures with a canonical pose–movement recipe that reads without
  partner turn-taking, navigation coupling, or action-phase framing.

# Flat cue list (space-separated) — same convention as pilot90_all.yml
emblem_cues_exp1: >-
  raise_fists_victory fist_pump flex_bicep shrug_idk self_scratch_head_confused
  facepalm point_self point_you beckon_come_here stop_palm_out pat_stomach
  fan_face_hot cover_yawn_sleepy rub_eye_tired tap_temple_think circle_temple_crazy
  cover_mouth_gasp cheers_toast highfive_invite highfive_imitation fistbump_invite
  pat_self_back draw_circle_repeat throat_cut_stop chin_flick_dismiss cover_ears_too_loud
  salute visor_search nod_yes shake_head_no air_quotes self_hug tilt_head_curious
  raise_index_one_moment shh_gesture rub_arms_cold cross_arms_defensive
  palms_together_thank_you hands_up_surrender arms_open_welcome stretch_arms_up
  eye_widen_surprise gaze_shift_avoid

cues:
  - {idx: 7, cue: raise_fists_victory, recipe: both fists raised overhead}
  - {idx: 8, cue: fist_pump, recipe: clenched fist upward thrust}
  - {idx: 9, cue: flex_bicep, recipe: arm bent, bicep display hold}
  - {idx: 10, cue: shrug_idk, recipe: shoulder lift + palms up}
  - {idx: 11, cue: self_scratch_head_confused, recipe: hand on head, scratch repeat}
  - {idx: 12, cue: facepalm, recipe: palm covers face}
  - {idx: 13, cue: point_self, recipe: index/hand to chest}
  - {idx: 14, cue: point_you, recipe: index/hand forward to addressee}
  - {idx: 15, cue: beckon_come_here, recipe: palm in + finger curl repeat}
  - {idx: 16, cue: stop_palm_out, recipe: open palm forward hold}
  - {idx: 17, cue: pat_stomach, recipe: hand pat on stomach}
  - {idx: 18, cue: fan_face_hot, recipe: hand fans face}
  - {idx: 19, cue: cover_yawn_sleepy, recipe: hand covers yawning mouth}
  - {idx: 20, cue: rub_eye_tired, recipe: hand rubs eye}
  - {idx: 21, cue: tap_temple_think, recipe: finger taps temple}
  - {idx: 22, cue: circle_temple_crazy, recipe: finger circles at temple}
  - {idx: 24, cue: cover_mouth_gasp, recipe: palm covers mouth (gasp)}
  - {idx: 25, cue: cheers_toast, recipe: hand raised like toast glass}
  - {idx: 26, cue: highfive_invite, recipe: open palm up, invite hold}
  - {idx: 27, cue: highfive_imitation, recipe: palm swings down (high-five)}
