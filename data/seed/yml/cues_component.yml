A:
  wave_hi:
    movement: Repeated side-to-side swinging motion of the raised hand.

  raising_hand_greeting:
    pose: One arm lifted upward with an open acknowledgment posture.
    movement: Upward arm-raising motion to initiate greeting.

  handshake_offer:
    pose: Hand extended forward toward the interaction partner.
    movement: Reach forward and stabilize the offered hand.

  handshake_imitation:
    pose: Hand extended toward the partner in mirrored handshake position.
    movement: Synchronized extension and grasp-like motion mirroring the partner.

  hand_over_heart:
    pose: Hand placed firmly over the chest.

  fist_pump:
    pose: Arm raised with clenched fist.
    movement: Short upward thrust motion.

  flex_bicep:
    pose: Arm bent with bicep area emphasized.
    movement: Tightening or holding motion to display strength.

  point_self:
    pose: Hand directed toward the chest or body.
    movement: Brief inward-directed pointing motion.

  point_you:
    pose: Finger or hand directed toward another target.
    movement: Extension motion emphasizing directional targeting.

  cheers_toast:
    pose: Hand raised outward and slightly upward.
    movement: Upward celebratory lifting motion.

  highfive_invite:
    pose: Raised open palm held at interaction height.
    movement: Upward presenting motion followed by hold.

  highfive_imitation:
    pose: Raised open palm aligned with the partner’s palm.
    movement: Synchronized upward palm motion mirroring the partner.

  fistbump_invite:
    pose: Closed fist extended toward another agent.
    movement: Short forward extension and pause.

  pat_self_back:
    pose: Hand positioned near the upper back or shoulder.
    movement: Small self-contact patting motion.

  salute:
    pose: Hand raised to the forehead with upright posture.

  visor_search:
    pose: Hand placed above the eyes.
    movement: Scanning motion while maintaining shaded-eye posture.

  yield_turn:
    movement: Lowering or retracting hand motion to yield the turn.

  request_turn:
    pose: Hand raised slightly forward.
    movement: Small forward raising motion requesting a turn.

  guiding_arm:
    pose: Open arm oriented toward a destination.
    movement: Sweeping directional motion guiding attention or navigation.

  protective_arm_out:
    pose: Arm positioned between entities protectively.
    movement: Lateral extension blocking or shielding space.

  turn_yield_lower_hand:
    movement: Lowering the raised hand while turning away to yield.

  slow_down_request_palm_down:
    pose: Palm facing downward.
    movement: Repeated downward calming motion.

  firm_accept_forward_reach:
    pose: Arm oriented directly toward the target.
    movement: Decisive forward reach with stable extension.

  hesitant_accept_half_reach:
    pose: Partially extended reaching posture.
    movement: Slow incomplete forward reach with hesitation.

  cancel_previous_offer_retract:
    movement: Retraction of the previously extended hand toward the body.

  conditional_accept_pause_then_reach:
    pose: Prepared reaching posture.
    movement: Pause followed by delayed forward extension.

  final_decision_down_press:
    pose: Hand positioned above action endpoint.
    movement: Firm downward pressing motion signaling finality.

  resume_speaking_pull:
    movement: Inward pulling motion toward the torso to reclaim control.

  emphasize_point_downbeat:
    pose: Arm prepared above emphasis point.
    movement: Sharp downward beat motion.

  finish_action_down_release:
    movement: Gradual downward arm release after completion.

  prepare_action_raise_hold:
    pose: Raised arm held in readiness.
    movement: Upward lifting followed by sustained pause.

  beckon_come_here:
    pose: Arm extended outward with palm oriented inward/upward.
    movement: Repeated pulling motion toward the body.

  stop_palm_out:
    pose: Open palm facing outward toward the target.

  scale_expand:
    pose: Arms spread apart laterally.
    movement: Expanding outward motion increasing perceived scale.

  scale_compress:
    pose: Hands positioned facing inward.
    movement: Inward compressing motion reducing perceived scale.

  uncertainty_wave:
    movement: Loose oscillating hand motion with unstable rhythm.

  exploration_reach:
    movement: Slow cautious forward reaching motion toward an object or space.

H:
  interrupt_hard:
    movement: Sudden sharp stopping or cutting motion.

  interrupt_soft:
    movement: Gentle slowing or lifting motion that introduces a pause cue.

  sync_cue:
    essence: Motion timing matched rhythmically with another agent or event.

  rhythmic_variation:
    movement: Intentional modulation of motion timing and rhythm.

  micro_adjust:
    movement: Small corrective movements refining positioning continuously.

  hold_steady:
    pose: Stable maintained posture or gesture with minimal variation.

  draw_circle_repeat:
    movement: Repeated circular tracing motion in the air.

  clarification_request_palm_tilt:
    pose: Palm tilted upward or sideways.
    movement: Small lifting or rotating motion requesting clarification.

  speed_up_circular_cue:
    movement: Fast repeated circular hand rotations encouraging acceleration.

  continue_on_forward_roll:
    movement: Continuous forward rolling hand motion prompting continuation.

  polite_decline_small_push:
    pose: Open palm oriented outward.
    movement: Small gentle pushing motion away from the body.

  unsure_response_hand_hover_stop:
    pose: Hand held uncertainly in midair.
    movement: Slight forward movement followed by pause and hold.

  curl_fingers_give_me:
    movement: Repeated inward curling of fingers toward the body.

  raise_index_one_moment:
    pose: Index finger raised vertically.
    movement: Quick upward raising motion followed by hold.

  tempo_cue:
    essence: Motion speed modulation communicating pacing or timing.

  hesitation_pause_hold:
    movement: Motion initiation followed by pause and delayed continuation.

  start_action_forward_snap:
    pose: Arm aligned toward target direction.
    movement: Sudden fast snapping initiation motion.

  stop_action_freeze_palm:
    pose: Open palm displayed outward.
    movement: Abrupt stopping and freezing of ongoing motion.

  retry_action_reset_circle:
    movement: Retraction followed by looping retry motion.

B:
  contain_space:
    pose: Arms positioned inward around the body space.
    movement: Inward enclosing motion compressing interaction space.

  expand_space:
    pose: Arms widely opened.
    movement: Outward expansion enlarging interaction space.

  compress_space:
    pose: Hands facing inward symmetrically.
    movement: Symmetric inward reduction of occupied space.

  balance_scale:
    pose: Both hands raised oppositely.
    movement: Alternating balancing motion between two sides.

  push_pull_dual:
    pose: One arm forward and one arm backward.
    movement: Simultaneous opposing push-pull motion.

  enclose_self_protection:
    pose: Both arms wrapped around the torso defensively.

  release_open_outward:
    pose: Initially closed inward posture.
    movement: Expanding outward opening release.

  big_heart_above_head:
    pose: Arms forming a heart shape above the head.
    movement: Upward curved arm formation motion.

  raise_fists_victory:
    pose: Both fists raised overhead.
    movement: Energetic upward thrust motion.

  self_hug:
    pose: Arms wrapped inward around the torso.

  cross_arms_defensive:
    pose: Both arms folded tightly across the chest.

  hands_up_surrender:
    pose: Both hands raised upward with open palms visible.

  arms_open_welcome:
    pose: Both arms opened outward broadly toward others.

  stretch_arms_up:
    pose: Both arms extended fully upward.
    movement: Upward stretching extension.

  air_quotes:
    pose: Index and middle fingers raised on both hands.
    movement: Repeated finger flexion quotation gesture.

  rub_arms_cold:
    pose: Arms crossed near torso.
    movement: Repetitive rubbing motion across the arms.

  palms_together_thank_you:
    pose: Both palms pressed together in front of the body.

  dominance_high_open_hold:
    pose: Arms held high and wide with expanded body posture.

W:
  lean_forward_interest:
    pose: Torso angled forward toward the target.
    movement: Gradual forward leaning motion.

  abandon_action_drop_turn:
    movement: Dropping torso and rotating away to signal disengagement.

  weight_shift_forward:
    pose: Body center positioned forward.
    movement: Controlled forward transfer of body weight.

  weight_shift_backward:
    pose: Body center positioned backward.
    movement: Controlled backward transfer of body weight.

  torso_rotate_away:
    pose: Torso oriented away from the target.
    movement: Rotational turning away motion.

  torso_rotate_toward:
    pose: Torso oriented toward the target.
    movement: Rotational turning toward motion.

  lean_side_doubt:
    pose: Sideways tilted torso posture.
    movement: Subtle lateral leaning motion.

  contract_body:
    pose: Torso and limbs pulled inward to reduce openness.

  expand_chest:
    pose: Chest pushed outward with open upright torso.

A & W:
  shrug_idk:
    pose: Raised shoulders with loosened arms.
    movement: Brief upward shoulder lifting motion.

  escorting_gesture:
    pose: Open guiding arm with aligned torso orientation.
    movement: Coordinated directional guiding motion while moving.

  wait_for_me_backward_palm:
    pose: Palm extended backward.
    movement: Backward sweeping or holding motion requesting pause.

  commit_action_fast_reach:
    pose: Forward-leaning body oriented toward the target.
    movement: Rapid forward reach with decisive momentum.

  prevent_fall_support_reach:
    pose: Arm and torso oriented toward the falling target.
    movement: Quick support-reaching motion toward the target.

  frustration_down_throw:
    pose: Raised tense arm posture.
    movement: Sudden downward throwing motion.

  submission_lowered_open_palm:
    pose: Lowered torso with open palms presented submissively.

  apology_forward_lowered_hold:
    pose: Lowered torso and reduced body openness.
    movement: Slow forward lean followed by sustained stillness.

F:
  eye_widen_surprise:
    pose: Eyes opened widely.
    movement: Rapid eye expansion onset.

  eye_narrow_skeptic:
    pose: Eyes narrowed slightly.

  gaze_shift_avoid:
    pose: Head and eyes redirected away.
    movement: Sudden gaze redirection motion.

  gaze_lock_focus:
    pose: Stable forward-facing gaze fixed on a target.

  blink_rapid_nervous:
    movement: Rapid repeated blinking with unstable tempo.

  micro_smile_acknowledge:
    pose: Slightly raised mouth corners.
    movement: Brief subtle onset of smile.

  lip_press_hold_back:
    pose: Lips pressed tightly together with restrained expression.

  nod_yes:
    movement: Repeated vertical head oscillation.

  shake_head_no:
    movement: Repeated horizontal head oscillation.

  tilt_head_curious:
    pose: Head slightly tilted sideways while maintaining attention.

L:
  step_forward_commit:
    pose: Forward-oriented body posture.
    movement: Deliberate forward stepping action.

  side_step_avoid:
    pose: Body laterally offset from the target.
    movement: Sideways locomotion avoiding direct path.

  approach_gradual:
    movement: Slow progressive forward locomotion.

  retreat_fast:
    movement: Rapid backward locomotion increasing distance.

  circle_around:
    pose: Continuous orientation toward target while moving.
    movement: Circular locomotion around the target.

  bounce_energy:
    movement: Repeated light bouncing conveying energetic excitement.

  freeze_feet:
    pose: Stable grounded stance.
    movement: Abrupt cessation of locomotion.

  step_back_surprised:
    pose: Upper body recoiling slightly backward.
    movement: Sudden backward stepping motion.

  gentle_retreat_motion:
    pose: Open but distancing posture.
    movement: Slow backward locomotion.

  stop_entry_cross_block:
    pose: Body positioned across the path.
    movement: Lateral blocking step into the trajectory.

  allow_entry_open_side:
    pose: Side-open body orientation.
    movement: Stepping aside to create passage space.

  commit_action_fast_reach:
    movement: Rapid forward locomotion with decisive momentum.

  disengage_step_back_release:
    pose: Reduced forward orientation.
    movement: Gradual backward stepping while releasing engagement.

  small_rhythmic_bounce:
    movement: Small repetitive vertical bouncing rhythm.

H & F:
  blow_kiss:
    pose: Hand positioned near the mouth.
    movement: Outward releasing motion away from the lips.

  scratch_head_confused:
    pose: Hand contacting the head.
    movement: Small repetitive scratching motion.

  facepalm:
    pose: Palm covering the face.
    movement: Rapid upward movement toward the face.

  rub_eye_tired:
    pose: Hand positioned near the eye.
    movement: Repeated rubbing motion around the eye area.

  tap_temple_think:
    pose: Finger placed near the temple.
    movement: Repeated tapping motion implying cognition.

  circle_temple_crazy:
    pose: Finger positioned beside the temple.
    movement: Repeated circular rotation near the head.

  cover_mouth_gasp:
    pose: Hand covering the mouth.
    movement: Rapid upward covering motion after surprise.

  chin_flick_dismiss:
    pose: Fingers placed beneath the chin.
    movement: Outward flicking release motion.

  cover_ears_too_loud:
    pose: Hands placed over both ears.
    movement: Fast upward covering motion.

  shh_gesture:
    pose: Finger vertically positioned near the lips.
    movement: Brief upward placement and hold.

  disagreement_cross_then_release:
    pose: Arms or hands briefly crossed.
    movement: Crossing followed by outward releasing motion.

  throat_cut_stop:
    pose: Hand aligned horizontally near the throat.
    movement: Sharp lateral slicing motion.

M:
  thinking:
    essence: Emerges from sustained pauses, gaze behavior, and temporal pacing rather than a single pose or movement.

  skepticism:
    essence: Expressed through combined facial restraint, posture asymmetry, and interaction timing.

  agreement:
    essence: Distributed across coordinated affirmative behaviors rather than a single invariant motion.

  shame:
    essence: Emerges from reduced openness, lowered gaze, and withdrawal tendencies.

  confusion:
    essence: Characterized by unstable transitions, hesitation, and inconsistent directional commitment.

  curiosity:
    essence: Defined by exploratory orientation and attention dynamics across multiple modalities.

  anticipation:
    essence: Emerges from sustained readiness and restrained energetic tension.

  regret:
    essence: Characterized by slowed movement and reduced expansiveness after action completion.

  relief:
    essence: Expressed through tension release and posture relaxation following uncertainty.

  confidence:
    essence: Distributed across decisiveness, stability, and expanded posture patterns.

  hesitation:
    essence: Primarily a temporal modulation pattern interrupting ongoing action flow.

  urgency:
    essence: Expressed through increased speed, shortened pauses, and rapid transitions.

  curiosity_intense:
    essence: Amplified exploratory attention with sustained forward orientation and fixation.

  passive_acceptance:
    essence: Defined more by absence of resistance than by a specific movement primitive.

  active_resistance:
    essence: Emerges through blocking, withdrawal, and opposition behaviors across contexts.

  attention_shift:
    essence: Defined by coordinated reorientation of gaze, posture, and interaction focus.

  engagement_level:
    essence: A latent interactional state reflected through motion intensity and openness over time.

  social_distance:
    essence: Encoded through spatial regulation and relational positioning between agents.