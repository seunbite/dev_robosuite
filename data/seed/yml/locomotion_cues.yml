iconic:
  trot_forward_happy: Light trotting forward with rhythmic head bob and tail sway (Happy / Energetic movement)
  run_fast_straight: Accelerate into a straight fast run with extended strides (Urgency / Chase)
  slow_walk_relaxed: Walk forward with even slow steps and loose body sway (Calm / Relaxed)
  bounce_in_place: Repeated small vertical hops using all legs (Excited / Anticipation)
  hop_forward_two_leg_push: Push forward with both hind legs in short hops (Playful advance)
  circle_spin_fast: Run in a tight fast circle around a point (Excitement / Overstimulated)
  circle_spin_slow: Walk in a slow controlled circle (Patrolling / Thinking-like)
  zigzag_run: Run forward in quick alternating diagonal directions (Play / Unpredictable energy)
  sudden_stop_skid: Run then abruptly stop with front-leg brace (Alert / Reaction)
  backstep_retreat: Step backward in short quick steps (Avoidance / Uncertainty)
  cautious_step_forward: Take slow toe-first steps with lowered body (Caution)
  crouch_walk_low: Move forward with body lowered close to ground (Stealth / Fear)
  stalk_forward_slow: Slow deliberate forward steps with minimal vertical motion (Hunting / Focus)
  pounce_forward_jump: Sudden forward leap using hind legs (Attack / Play pounce)
  recoil_jump_back: Jump backward quickly with all legs (Startle / Fear)
  side_step_shift: Step sideways while keeping body facing forward (Avoid / Adjust)
  pivot_turn_fast: Rotate body quickly on front legs to change direction (Reactivity)
  wide_turn_arc: Move in a wide curved path smoothly (Exploration)
  tight_corner_turn: Sharp angular turn with quick foot repositioning (Precision)
  diagonal_prance: Lift legs higher while moving diagonally (Playful energy)
  uneven_limp_walk: Walk with one shortened step cycle (Injury / Weakness cue)
  drag_step_forward: Drag hind legs slightly while moving forward (Fatigue / Low energy)
  head_low_trudge: Walk forward with head lowered and heavy steps (Tired / Defeated)
  quick_step_shuffle: Rapid small steps without full stride extension (Nervous energy)
  pause_step_resume: Walk → stop → resume repeatedly (Uncertainty)
  forward_lunge_step: Take one exaggerated long step forward (Commit / Push)
  retreat_turn_away: Step back then turn body away (Disengage)
  follow_arc_approach: Approach target in curved path (Non-threatening approach)
  straight_line_approach: Direct linear approach with steady pace (Confidence)
  hesitant_approach_stop: Approach halfway then stop abruptly (Uncertainty)
  overshoot_and_correct: Pass target then step back to correct position (Clumsy / Playful)
  circle_then_sit_drop: Circle once then drop body down (Settle)
  bounce_step_forward: Insert small hops between steps (Excited locomotion)
  stiff_leg_walk: Move with reduced joint bending (Tension)
  sway_body_walk: Walk with exaggerated side-to-side body sway (Loose / Silly)
  fast_pace_loop: Repeated pacing back and forth (Restless)
  short_radius_pacing: Tight repeated pacing in small area (Anxiety)
  spiral_inward_walk: Move in tightening spiral toward a point (Focus / Curiosity)
  spiral_outward_walk: Move outward in expanding spiral (Exploration)
  step_and_freeze: Step forward then freeze briefly (Alert)
  reactive_back_forth: One step forward, one step back repeatedly (Conflict / Hesitation)
  bounding_run: Alternate long bounding strides (High energy)
  low_energy_shuffle: Minimal lift slow shuffle forward (Exhaustion)
  front_heavy_walk: Shift weight toward front legs while moving (Focus / Intent)
  rear_push_emphasis: Strong hind-leg push each step (Drive / Power)
  curved_retreat: Move backward along a curved path (Avoid while tracking)
  turn_head_while_walking: Walk forward while frequently turning head (Scanning)
  step_over_obstacle: Lift legs higher to step over imaginary object (Careful navigation)
  stumble_recover: Brief stumble then regain rhythm (Clumsy recovery)
  skid_turn_side: Slide slightly while turning (Speed / Momentum)
  approach_then_circle_target: Approach then orbit target (Curiosity)
contextual:
  sulk_walk_away: Turn body away and walk off with slow dragging steps (Sulking)
  pouty_shuffle_forward: Small dragging steps with lowered head and inward posture (Pouting)
  excited_hop_approach: Repeated small hops while moving toward target (Excited greeting)
  nervous_pacing_loop: Tight repetitive pacing with quick turns (Anxiety)
  laugh_bounce_walk: Forward movement with rhythmic bouncing as if laughing (Laughter expression)
  giggle_side_step: Side-stepping with small shoulder-like bounces (Playful giggle)
  scared_freeze_then_back: Freeze → sudden backward steps (Fear reaction)
  timid_half_step_forward: Step forward halfway then retract (Shyness)
  dramatic_turn_and_walk: Sharp turn then exaggerated slow walk away (Dramatic exit)
  proud_strut_forward: Forward walk with slightly elevated front and longer steps (Pride)
  swagger_side_sway_walk: Walk with exaggerated lateral sway (Confidence / Swagger)
  embarrassed_turn_circle: Turn in small circle before moving away (Embarrassment)
  avoidant_curve_walk: Move in curved path avoiding direct alignment (Avoidance)
  clingy_follow_close: Follow very closely with short quick steps (Attachment)
  impatient_step_tap: Repeated forward step and quick reset (Impatience)
  eager_anticipation_bounce: Bounce in place before moving forward (Anticipation)
  hesitant_circle_approach: Circle slightly before committing forward (Uncertainty)
  startled_jump_then_freeze: Quick jump then full body freeze (Startled)
  relieved_slow_walk: Slow walk with gradual relaxation of posture (Relief)
  defeated_turn_back_walk: Turn away and walk slowly with heavy steps (Defeat)
  playful_fake_charge: Short forward charge then stop abruptly (Teasing)
  teasing_retreat: Step back playfully after approaching (Play tease)
  curious_head_lead_walk: Lead movement with head and neck extension (Curiosity)
  suspicious_side_glance_walk: Move forward while subtly angling body aside (Suspicion)
  sneaky_crouch_sneak: Low crouched forward movement (Sneaky / Mischief)
  dramatic_stop_and_look: Walk then sudden stop with held pose (Attention grab)
  indecisive_step_loop: Repeating small forward/back steps (Indecision)
  cling_then_release_walk: Approach close then quickly move away (Mixed emotion)
  overexcited_circle_run: Fast tight circles before moving forward (Overstimulation)
  shy_hide_behind_motion: Move behind imaginary object path (Shyness)
  follow_then_overtake: Follow briefly then rush ahead (Excitement)
  retreat_with_lookback: Step away while repeatedly turning back (Attachment / Hesitation)
  mock_scare_jump_side: Jump sideways dramatically (Playful scare)
  dramatic_slow_exit: Very slow exaggerated walk away (Theatrical)
  stubborn_refuse_move: Minimal forward progress despite stepping (Stubbornness)
  curious_stop_and_step: Stop frequently to take single steps (Inspection)
  awkward_overstep_walk: Over-extended steps causing imbalance (Awkwardness)
  tiptoe_sneak_walk: Very light careful stepping (Sneaking)
  relieved_drop_then_walk: Body drop then resume walking (Relief)
  attention_seek_circle: Circle around target repeatedly (Attention-seeking)
  jealous_interrupt_walk: Insert body between target and path (Jealousy)
  protective_block_step: Step in front and hold position (Protective)
  follow_stop_repeat: Follow then stop repeatedly (Uncertain following)
  slow_approach_with_pause: Approach with frequent pauses (Caution)
  playful_zigzag_approach: Zigzag while approaching (Playfulness)
  dramatic_recoil_walk_back: Step back with exaggerated motion (Shock)
  eager_forward_pull: Quick forward steps as if pulled (Eagerness)
  sleepy_drift_walk: Slow drifting path with unstable direction (Sleepy)
  grumpy_stomp_walk: Short heavy steps with force (Grumpy)
  shy_turn_and_peek_walk: Turn away then peek while moving (Shy curiosity)