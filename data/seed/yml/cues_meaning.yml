A:
  wave_hi: Raise the arm and repeatedly swing the hand side-to-side toward the target.
  raising_hand_greeting: Lift one arm upward with an open posture to initiate acknowledgment.
  handshake_offer: Extend the hand forward and hold it steadily toward the interaction partner.
  handshake_imitation: Mirror the partner’s handshake motion with synchronized extension and grasp.
  hand_over_heart: Place the hand on the chest and briefly hold to express sincerity or gratitude.
  fist_pump: Raise the arm with a clenched fist in a short upward thrust.
  flex_bicep: Bend the arm and tighten the bicep area to display strength or confidence.
  point_self: Direct the hand or finger toward the robot’s own body or chest area.
  point_you: Extend the arm and orient the finger or palm toward another person or object.
  cheers_toast: Raise the hand outward and slightly upward as if making a celebratory toast.
  highfive_invite: Raise the palm outward at shoulder level and hold to invite contact.
  highfive_imitation: Mirror the partner’s raised palm movement in synchronization.
  fistbump_invite: Extend a closed fist forward and pause to invite contact.
  pat_self_back: Move the hand to the upper back or shoulder area in a self-congratulatory motion.
  salute: Raise the hand to the forehead in a brief formal acknowledgment.
  visor_search: Place the hand above the eyes as if blocking light while scanning the environment.
  yield_turn: Lower or retract the hand to indicate conversational yielding.
  request_turn: Raise the hand slightly forward to request speaking or action opportunity.
  guiding_arm: Sweep the arm outward toward a destination to indicate direction or invitation.
  protective_arm_out: Extend the arm laterally between the target and another entity protectively.
  turn_yield_lower_hand: Lower the raised hand while slightly turning away to give up the turn.
  slow_down_request_palm_down: Move the palm downward repeatedly in a calming or slowing motion.
  firm_accept_forward_reach: Reach forward decisively with direct and stable extension.
  hesitant_accept_half_reach: Partially extend the arm forward with reduced confidence and slower motion.
  cancel_previous_offer_retract: Pull the previously extended hand back toward the body.
  conditional_accept_pause_then_reach: Pause briefly before extending the hand forward conditionally.
  final_decision_down_press: Move the hand downward firmly to signal finalization or commitment.
  resume_speaking_pull: Pull the hand inward toward the torso to reclaim conversational control.
  emphasize_point_downbeat: Perform a sharp downward beat motion to emphasize a statement.
  finish_action_down_release: Lower the arm gradually after completing an action.
  prepare_action_raise_hold: Raise the arm and hold briefly in preparation for action.
  beckon_come_here: Extend the arm forward and repeatedly pull the hand inward toward the body.
  stop_palm_out: Raise the palm outward toward the target and hold the position firmly.
  scale_expand: Move the arms outward to illustrate increasing size or magnitude.
  scale_compress: Bring the hands inward to indicate reduction or compression.
  uncertainty_wave: Move the hand side-to-side loosely to express uncertainty.
  exploration_reach: Slowly extend the arm toward an object or space with cautious forward motion.

H:
  interrupt_hard: Perform a sudden sharp stopping or cutting motion to break the flow.
  interrupt_soft: Introduce a gentle pause cue with a small slowing or lifting motion.
  sync_cue: Match motion timing rhythmically with another agent or event.
  rhythmic_variation: Introduce repeated motion timing changes to create expressive rhythm.
  micro_adjust: Apply small corrective movements to refine positioning.
  hold_steady: Maintain a stable posture or gesture with minimal movement variation.
  draw_circle_repeat: Repeatedly trace a circular motion in the air with the hand.
  clarification_request_palm_tilt: Tilt the palm upward or sideways to request clarification.
  speed_up_circular_cue: Rotate the hand in repeated circles to encourage faster progress.
  continue_on_forward_roll: Roll the hand forward repeatedly to encourage continuation.
  polite_decline_small_push: Perform a small outward pushing motion to softly reject an offer.
  unsure_response_hand_hover_stop: Move the hand forward slightly, pause midair, and hold uncertainly.
  curl_fingers_give_me: Repeatedly curl the fingers inward to request transfer or approach.
  raise_index_one_moment: Raise the index finger vertically to request a short pause.
  tempo_cue: Modulate hand motion speed to communicate pacing or timing.
  hesitation_pause_hold: Begin an action, briefly freeze, then continue with reduced confidence.
  start_action_forward_snap: Snap the hand or arm forward quickly to initiate action.
  stop_action_freeze_palm: Abruptly stop motion with an open palm freeze posture.
  retry_action_reset_circle: Retract and loop the hand motion before attempting the action again.

B:
  contain_space: Bring both arms inward to compress or limit the occupied interaction space.
  expand_space: Spread both arms outward to increase perceived openness or dominance.
  compress_space: Move both arms inward symmetrically to reduce spatial extent.
  balance_scale: Raise both hands oppositely as if weighing two alternatives.
  push_pull_dual: Simultaneously push one hand forward while pulling the other backward.
  enclose_self_protection: Wrap both arms around the torso defensively for self-protection.
  release_open_outward: Open both arms outward from a closed posture to signal release.
  big_heart_above_head: Form a large heart shape above the head using both arms.
  raise_fists_victory: Raise both clenched fists upward energetically in celebration.
  self_hug: Wrap both arms inward across the torso in a self-contact posture.
  cross_arms_defensive: Fold both arms tightly across the chest to signal closure or resistance.
  hands_up_surrender: Raise both hands upward with open palms to indicate surrender.
  arms_open_welcome: Open both arms widely toward the interaction partner in a receptive posture.
  stretch_arms_up: Extend both arms upward fully in a stretching motion.
  air_quotes: Repeatedly flex index and middle fingers on both hands to indicate quotation.
  rub_arms_cold: Rub both arms repeatedly to simulate feeling cold.
  palms_together_thank_you: Press both palms together in front of the body respectfully.
  dominance_high_open_hold: Hold both arms high and open to maximize perceived dominance.

W:
  lean_forward_interest: Tilt the upper body slightly forward toward the target of attention.
  abandon_action_drop_turn: Drop the torso and rotate away to signal disengagement.
  weight_shift_forward: Shift body weight toward the front to increase engagement.
  weight_shift_backward: Shift body weight backward to increase distance or reduce engagement.
  torso_rotate_away: Rotate the torso away from the interaction target.
  torso_rotate_toward: Rotate the upper body toward the interaction partner or object of focus.
  lean_side_doubt: Tilt the torso sideways subtly to express doubt or skepticism.
  contract_body: Pull the torso inward to reduce physical openness.
  expand_chest: Push the chest outward to increase openness or confidence.

A & W:
  shrug_idk: Raise the shoulders slightly while loosening the arms to express uncertainty.
  escorting_gesture: Extend the arm while orienting the torso to guide another person.
  wait_for_me_backward_palm: Extend the palm backward while moving away to request waiting.
  commit_action_fast_reach: Lean forward while rapidly extending the arm toward a target.
  prevent_fall_support_reach: Quickly extend the arm and torso toward someone losing balance.
  frustration_down_throw: Throw the arms downward sharply with torso tension to express frustration.
  submission_lowered_open_palm: Lower the torso slightly while presenting open palms submissively.
  apology_forward_lowered_hold: Lean forward with lowered arms and sustained stillness to express apology.

F:
  eye_widen_surprise: Rapidly enlarge the eye opening while orienting attention forward.
  eye_narrow_skeptic: Narrow the eyes slightly to express skepticism or suspicion.
  gaze_shift_avoid: Redirect gaze away from the target to reduce engagement.
  gaze_lock_focus: Maintain stable eye orientation toward a specific target.
  blink_rapid_nervous: Blink repeatedly at high frequency to convey nervousness.
  micro_smile_acknowledge: Slightly raise the mouth corners for a brief acknowledgment cue.
  lip_press_hold_back: Press the lips together tightly to suppress reaction or emotion.
  nod_yes: Repeatedly tilt the head downward and upward in a rhythmic motion.
  shake_head_no: Repeatedly rotate the head side-to-side to indicate disagreement.
  tilt_head_curious: Slightly incline the head sideways while maintaining visual attention.

L:
  step_forward_commit: Take a deliberate forward step indicating engagement or commitment.
  side_step_avoid: Move laterally away from a target while maintaining orientation.
  approach_gradual: Slowly move toward the interaction target with controlled velocity.
  retreat_fast: Quickly move backward to increase distance from the target.
  circle_around: Move around a target in a curved or circular path.
  bounce_energy: Repeatedly bounce the body lightly to convey excitement or energy.
  freeze_feet: Stop all locomotion abruptly while maintaining stance.
  step_back_surprised: Take a sudden backward step in response to surprise.
  gentle_retreat_motion: Slowly move backward while maintaining soft engagement.
  stop_entry_cross_block: Step across the target’s path to physically block entry.
  allow_entry_open_side: Move sideways and open body orientation to allow passage.
  commit_action_fast_reach: Rapidly move toward the target with decisive forward momentum.
  disengage_step_back_release: Step backward gradually while releasing engagement posture.
  small_rhythmic_bounce: Perform repeated small vertical bounces rhythmically.

H & F:
  blow_kiss: Touch the mouth lightly and extend the hand outward playfully.
  scratch_head_confused: Move the hand to the head and perform small repetitive scratching motions.
  facepalm: Bring the palm to the face in a quick covering motion.
  rub_eye_tired: Rub the eye area repeatedly with the hand to express fatigue.
  tap_temple_think: Touch or tap the temple area repeatedly to imply cognitive processing.
  circle_temple_crazy: Rotate the finger near the temple repeatedly to imply irrationality.
  cover_mouth_gasp: Rapidly move the hand to cover the mouth following a surprise reaction.
  chin_flick_dismiss: Flick the fingers outward from beneath the chin dismissively.
  cover_ears_too_loud: Place the hands over the ears to block overwhelming sound.
  shh_gesture: Raise one finger vertically near the mouth and hold briefly.
  disagreement_cross_then_release: Cross the arms or hands briefly before releasing outward.
  throat_cut_stop: Move the hand horizontally across the throat sharply to signal stopping.

M:
  thinking: Sustain slow deliberate movements with intermittent pauses suggesting cognition.
  skepticism: Combine restrained motion and asymmetric posture to signal doubt.
  agreement: Use synchronized affirmative movements with open orientation.
  shame: Reduce body openness and lower gaze to minimize social presence.
  confusion: Alternate hesitant motions and pauses without stable directional commitment.
  curiosity: Lean and orient attention toward a target with exploratory motion.
  anticipation: Maintain forward-oriented readiness with restrained energetic motion.
  regret: Slow down movement and reduce posture openness after an action.
  relief: Release muscular tension and expand posture following uncertainty.
  confidence: Maintain stable expansive posture with decisive motion timing.
  hesitation: Begin motion, pause midway, and continue with reduced certainty.
  urgency: Increase motion speed and reduce pause duration to prioritize rapid action.
  curiosity_intense: Intensify forward orientation and sustained attention toward the target.
  passive_acceptance: Allow interaction without active resistance or initiative.
  active_resistance: Introduce blocking or withdrawing motion against external influence.
  attention_shift: Redirect gaze or body orientation from one target to another.
  engagement_level: Modulate posture openness and movement intensity to reflect involvement.
  social_distance: Adjust spatial proximity and body orientation relative to others.