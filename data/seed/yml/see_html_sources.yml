# Canonical paths per embodiment: prompt, shots, merged motion JSON, render root, HTML stems.
# Paths are relative to the dev_robosuite repo root.
# See also: adhoc/generation/embodiment_sources.py
#
# HTML outputs use one file per calendar day: {html_stem}_YYYYMMDD.html (overwrites same day).

manipulator:
  prompt_file: data/seed/prompt/manipulator/prompt_v19_sophisticated.txt
  shots_json: data/seed/shots/manipulator/shot_configs_v19_sophisticated.json
  motion_config_json: data/results/motion_configs/manipulator/motion_configs_prompt_v19_sophisticated_no_reasoning_merged_104.json
  render_dir: data/results/render/manipulator
  see_html_subdir: manipulator
  see_html_stem: see_manipulator
  render_html_subdir: manipulator
  render_html_stem: render_manipulator

google_robot:
  label: bimanual
  prompt_file: data/seed/prompt/google_robot/prompt_19_mobile.txt
  shots_json: data/seed/shots/google_robot/shot_configs_19_mobile.json
  motion_config_json: data/results/motion_configs/google_robot/motion_configs_19_mobile.json
  render_dir: data/results/render/google_robot
  see_html_subdir: google_robot
  see_html_stem: see_google_robot
  render_html_subdir: google_robot
  render_html_stem: render_google_robot

quadruped:
  prompt_file: data/seed/prompt/quadruped/prompt_19_locomotion.txt
  shots_json: data/seed/shots/quadruped/shot_configs_19_locomotion.json
  motion_config_json: data/results/motion_configs/quadruped/motion_configs_prompt19_cues_new_merged.json
  render_dir: data/results/render/quadruped
  see_html_subdir: quadruped
  see_html_stem: see_quadruped
  render_html_subdir: quadruped
  render_html_stem: render_quadruped

cross:
  html_dir: data/results/html/cross_embodiment
  html_stem: see_cross_embodiment
  column_order: [quadruped, manipulator, google_robot]
